<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oni OS Dock</title>
  <link rel="stylesheet" href="dock.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="dock-viewport" id="dock-viewport">
    <!-- Always-on-Top Oni OS Start Menu Overlay -->
    <div class="os-start-menu hidden" id="os-start-menu">
      <div class="os-start-header">
        <div class="os-user-profile">
          <img src="../../assets/app-icon.png" alt="User">
          <div>
            <div class="os-user-name">Oni Browser</div>
            <div class="os-user-role">Oni OS Environment</div>
          </div>
        </div>
        <button class="os-start-edit-btn" id="os-start-btn-edit" type="button" title="Reorganize pinned apps">Edit</button>
      </div>

      <div class="os-start-section-title">Pinned Applications</div>
      <div class="os-start-apps-grid" id="os-start-apps-grid">
        <!-- Populated dynamically -->
      </div>

      <div class="os-start-footer">
        <button class="os-start-action" id="os-start-btn-newtab" type="button">
          <span>＋ New Browser Tab</span>
        </button>
        <button class="os-start-action" id="os-start-btn-pin" type="button">
          <span>＋ Pin New App</span>
        </button>
      </div>
    </div>

    <div class="dock-bar-wrap" id="dock-bar-wrap">
      <nav class="os-dock no-tabs" id="os-dock" aria-label="Oni OS Open Tabs Dock">
        <button class="os-dock-item start-orb" id="dock-btn-start" aria-label="Oni OS Start Menu" type="button">
          <img src="../../assets/app-icon.png" alt="Oni Start" class="dock-start-icon">
        </button>
        <div class="os-dock-sep hidden" id="dock-sep"></div>
        <div class="os-dock-tabs-wrap hidden" id="os-dock-tabs-wrap">
          <button class="dock-scroll-arrow left hidden" id="dock-scroll-left" type="button" aria-label="Scroll tabs left">‹</button>
          <div class="os-dock-tabs hidden" id="os-dock-tabs">
            <!-- Dynamically populated with currently open tabs (excluding home page) -->
          </div>
          <button class="dock-scroll-arrow right hidden" id="dock-scroll-right" type="button" aria-label="Scroll tabs right">›</button>
        </div>
      </nav>
    </div>

    <!-- App Context Menu (Start Menu Pinned Apps) -->
    <div class="os-context-menu hidden" id="os-app-context-menu">
      <button class="os-ctx-item" id="ctx-app-open" type="button">↗ Open</button>
      <button class="os-ctx-item" id="ctx-app-open-tab" type="button">＋ Open in New Tab</button>
      <button class="os-ctx-item" id="ctx-app-copy-link" type="button">🔗 Copy Link</button>
      <div class="os-ctx-sep"></div>
      <button class="os-ctx-item" id="ctx-app-edit" type="button">✏ Edit App</button>
      <button class="os-ctx-item os-ctx-item-danger" id="ctx-app-delete" type="button">🗑 Unpin App</button>
    </div>
  </div>
  <script src="dock.js"></script>
</body>
</html>
