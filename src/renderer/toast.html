<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oni OS Download Toast</title>
  <style>
    :root {
      --accent-green: #00ff88;
      --accent-rgb: 0, 255, 136;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .os-toast-card {
      width: calc(100% - 12px);
      height: calc(100% - 10px);
      background: rgba(10, 14, 24, 0.96);
      border: 1px solid rgba(var(--accent-rgb), 0.45);
      border-radius: 10px;
      padding: 7px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #f8fafc;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.85), 0 0 18px rgba(var(--accent-rgb), 0.22);
      backdrop-filter: blur(20px);
      animation: toastDrop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes toastDrop {
      from { opacity: 0; transform: translateY(-8px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .toast-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .toast-icon-wrap {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: rgba(var(--accent-rgb), 0.14);
      border: 1px solid rgba(var(--accent-rgb), 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-green);
      flex-shrink: 0;
    }
    .toast-icon-wrap svg {
      width: 14px;
      height: 14px;
      stroke: var(--accent-green);
    }
    .toast-texts {
      min-width: 0;
      flex: 1;
    }
    .toast-title {
      font-size: 11.5px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      line-height: 1.2;
    }
    .toast-subtitle {
      font-size: 10.5px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
      max-width: 180px;
    }
    .toast-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .toast-btn-open {
      background: rgba(var(--accent-rgb), 0.16);
      color: var(--accent-green);
      border: 1px solid rgba(var(--accent-rgb), 0.45);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .toast-btn-open:hover {
      background: var(--accent-green);
      color: #050b14;
      box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.45);
    }
    .toast-btn-close {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 13px;
      cursor: pointer;
      padding: 3px 5px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
    }
    .toast-btn-close:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="os-toast-card" id="os-toast-card">
    <div class="toast-left">
      <div class="toast-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="toast-texts">
        <div class="toast-title" id="toast-title">Download Complete</div>
        <div class="toast-subtitle" id="toast-filename">Downloading...</div>
      </div>
    </div>
    <div class="toast-actions">
      <button class="toast-btn-open" id="toast-btn-open">Open</button>
      <button class="toast-btn-close" id="toast-btn-close" title="Dismiss">✕</button>
    </div>
  </div>
  <script src="toast.js"></script>
</body>
</html>
