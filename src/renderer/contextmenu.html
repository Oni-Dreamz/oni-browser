<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oni OS Context Menu</title>
  <link rel="stylesheet" href="dock.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: var(--font-sans);
    }
    #context-menu-backdrop {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      background: transparent;
      pointer-events: auto;
    }
    .os-context-menu {
      position: fixed;
      width: 250px;
      background: rgba(10, 14, 24, 0.95);
      border: 1px solid rgba(0, 255, 136, 0.35);
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.85), 0 0 24px rgba(0, 255, 136, 0.2);
      backdrop-filter: blur(24px);
      z-index: 9999;
      pointer-events: auto;
      user-select: none;
      animation: osCtxPop 0.12s ease-out;
    }
  </style>
</head>
<body>
  <div id="context-menu-backdrop">
    <div class="os-context-menu hidden" id="os-page-context-menu"></div>
  </div>
  <script src="contextmenu.js"></script>
</body>
</html>
